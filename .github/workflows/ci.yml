name: M1 foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_ROOT_PASSWORD: ci-only-isolated-mysql-password
          MYSQL_DATABASE: esc_m1_test_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: mysql+pymysql://root:ci-only-isolated-mysql-password@127.0.0.1:3306/esc_m1_test_ci
      TEST_DATABASE_URL: mysql+pymysql://root:ci-only-isolated-mysql-password@127.0.0.1:3306/esc_m1_test_ci
      SESSION_SECRET: ci-only-synthetic-secret-for-isolated-tests-00000000
      MINIO_ENDPOINT: localhost
      MINIO_ACCESS_KEY: synthetic-user
      MINIO_SECRET_KEY: synthetic-storage-secret
      AI_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m compileall -q app alembic
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
      - run: uv run alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
