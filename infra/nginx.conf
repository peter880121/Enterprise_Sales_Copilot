resolver 127.0.0.11 valid=5s ipv6=off;
upstream esc_api {
    zone esc_api 64k;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 21m;
    error_page 413 = @upload_too_large;
    location @upload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"FILE_TOO_LARGE","message":"Upload exceeds limit","retryable":false},"request_id":"$request_id"}';
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /api/ {
        proxy_pass http://esc_api;
        proxy_next_upstream off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 15s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
